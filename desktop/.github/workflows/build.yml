name: Build Reggia desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^1.6" --locked
      - name: Build
        working-directory: desktop
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reggia-mac-universal
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^1.6" --locked
      - name: Build
        working-directory: desktop
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: reggia-windows-x64
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
