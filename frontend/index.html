<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reggia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/vs.min.css">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>

<div id="app">
  <!-- LEFT: Sidebar (sessions) -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span class="sidebar-brand">Reggia</span>
      <button id="btn-sidebar-collapse" class="btn-icon" title="Collapse sidebar">
        <i class="ti ti-layout-sidebar-left-collapse"></i>
      </button>
    </div>

    <div id="sidebar-actions">
      <button id="btn-new-session" class="btn-side-action" title="New chat">
        <i class="ti ti-edit"></i>
        <span>New chat</span>
      </button>
      <div class="sidebar-search-inputwrap">
        <i class="ti ti-search sidebar-search-icon"></i>
        <input
          type="text"
          id="sidebar-search-input"
          placeholder="Search chats..."
          autocomplete="off"
        />
        <i class="ti ti-x sidebar-search-clear" id="sidebar-search-clear" title="Clear" style="display:none"></i>
      </div>
    </div>

    <div id="sidebar-section-label">Recents</div>
    <div id="session-list"></div>
  </aside>

  <!-- Sidebar collapsed handle (left edge) -->
  <button id="sidebar-handle" class="rail-handle rail-handle-left" title="Expand sidebar" style="display:none">
    <i class="ti ti-layout-sidebar-left-expand"></i>
  </button>

  <!-- MIDDLE: Chat pane -->
  <div id="chat-pane">
    <div id="chat-header">
      <div class="chat-header-left">
        <button id="btn-sidebar-toggle-from-chat" class="btn-icon" title="Toggle sidebar" style="display:none">
          <i class="ti ti-layout-sidebar-left-expand"></i>
        </button>
        <button id="btn-new-chat-from-header" class="btn-icon" title="New chat">
          <i class="ti ti-edit"></i>
        </button>
        <span id="chat-title-text" class="chat-title">New chat</span>
      </div>
      <div class="chat-header-right">
        <button id="btn-reggia-toggle-from-chat" class="btn-icon" title="Toggle Reggia panel" style="display:none">
          <i class="ti ti-layout-sidebar-right-expand"></i>
        </button>
      </div>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-bar">
      <div class="chat-input-inner">
        <div class="chat-composer">
          <textarea
            id="chat-input"
            placeholder="Message Reggia..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <div class="chat-composer-actions">
            <div class="composer-actions-left">
              <select id="chat-model-select" class="chat-model-select-inline" title="Model"></select>
            </div>
            <div class="composer-actions-right">
              <button id="btn-send-chat" class="btn-composer-send" title="Send" disabled>
                <i class="ti ti-arrow-up"></i>
              </button>
              <button id="btn-stop-chat" class="btn-composer-stop" title="Stop generating" style="display:none">
                <i class="ti ti-square-filled"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Reggia panel -->
  <div id="reggia-panel">
    <div id="reggia-panel-header">
      <span class="reggia-panel-title">Active items</span>
      <button id="btn-reggia-collapse" class="btn-icon" title="Collapse panel">
        <i class="ti ti-layout-sidebar-right-collapse"></i>
      </button>
    </div>
    <div id="reggia-header">
      <div class="filter-pills">
        <span class="filter-pill active" data-filter="active">active</span>
        <span class="filter-pill" data-filter="pending">pending</span>
        <span class="filter-pill" data-filter="">all</span>
      </div>
      <i class="ti ti-plus" id="btn-add-item" title="New item"></i>
    </div>

    <div id="reggia-items"></div>

    <div id="reggia-footer">
      <span id="btn-open-notion">open in Notion <i class="ti ti-external-link"></i></span>
    </div>
  </div>

  <!-- Reggia collapsed handle (right edge) -->
  <button id="reggia-handle" class="rail-handle rail-handle-right" title="Expand Reggia panel" style="display:none">
    <i class="ti ti-layout-sidebar-right-expand"></i>
  </button>
</div>

<!-- Session context menu (floating, attached to body) -->
<div id="session-menu" class="session-menu" style="display:none">
  <div class="session-menu-item" data-action="star">
    <i class="ti ti-star"></i><span>Star</span>
  </div>
  <div class="session-menu-item" data-action="rename">
    <i class="ti ti-pencil"></i><span>Rename</span>
  </div>
  <div class="session-menu-divider"></div>
  <div class="session-menu-item session-menu-danger" data-action="delete">
    <i class="ti ti-trash"></i><span>Delete</span>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
